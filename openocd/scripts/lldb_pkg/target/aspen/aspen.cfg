# @file aspen.cfg

# @section Description
# This file is used for defining openocd configuration

adapter speed 3750

# Allow remote (non-localhost) gdb/telnet/tcl connections -- see GDB_REMOTE_HOST
# in settings.json. Only enable on trusted/VPN networks: this exposes
# unauthenticated telnet dap_access memory read/write to the network.
bindto 0.0.0.0

if { [info exists CHIPNAME] } {
   set _CHIPNAME $CHIPNAME
} else {
   set _CHIPNAME ASPEN
}

if { [info exists ENDIAN] } {
   set _ENDIAN $ENDIAN
} else {
   set _ENDIAN little
}

if { [info exists DAP_TAPID] } {
	set _DAP_TAPID $DAP_TAPID
} else {
	set _DAP_TAPID 0x5ba02477
}

set AP_NUM_APSS 1
set DBG_BASE_APSS_CORE0 0x92010000
set CTI_BASE_APSS_CORE0 0x92020000
set GDB_PORT_APSS_CORE0 3333

set AP_NUM_ADSP 1
set DBG_BASE_ADSP 0x91349000
set GDB_PORT_ADSP 3001

set DBG_BASE_AWM_CORE0 0xE000E000
set GDB_PORT_AWM_CORE0 3201
set AP_NUM_AWM 19

set DBG_BASE_SWM_CORE0 0xE000E000
set GDB_PORT_SWM_CORE0 3202
set AP_NUM_SWM 18


proc dap_reg_write {addr val} {
    global _CHIPNAME
    $_CHIPNAME.dap apreg 0 4 $addr
    $_CHIPNAME.dap apreg 0 0x0C $val
}

proc dap_reg_read {addr} {
    global _CHIPNAME
    $_CHIPNAME.dap apreg 0 4 $addr
    set value [$_CHIPNAME.dap apreg 0 0x0C]
    return $value
}

proc dap_reg_writeMask {addr val mask} {
    global _CHIPNAME
    set v [dapRegRead $addr]
    set data [expr {(~($mask) & $v) | ($mask & $val)}]
    dapRegWrite $addr $data
}

proc axi_reg_write {addr val} {
    global _CHIPNAME
    $_CHIPNAME.dap dpreg 0x8 0xf0
    $_CHIPNAME.dap dpreg 0x8 0x00
    $_CHIPNAME.dap apreg 0 0x00 0x11006012
    $_CHIPNAME.dap apreg 0 0x04 $addr
    $_CHIPNAME.dap apreg 0 0x08 0x00
    $_CHIPNAME.dap apreg 0 0x0C $val
}

reset_config trst_and_srst

# this will inform openocd to use only hardware breakpoints (THIS IS MANDATORY)
gdb_breakpoint_override hard

if {$_PROTOCOL == "swd"} {
   swd newdap $_CHIPNAME cpu -irlen 15 -expected-id $_DAP_TAPID
} elseif {$_PROTOCOL == "jtag"} {
   set _DAP_TAPID 0x5ba00477
   jtag newtap $_CHIPNAME cpu -irlen 4 -ircapture 1 -expected-id $_DAP_TAPID
}

dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu -ignore-syspwrupack
# ------------ APSS_CORE0 ---------------

cti create CTI_APSS_CORE0 -dap $_CHIPNAME.dap -baseaddr $CTI_BASE_APSS_CORE0 -ap-num $AP_NUM_APSS
target create $_CHIPNAME.apss.core0 aarch64 -dap $_CHIPNAME.dap -coreid 0 -dbgbase $DBG_BASE_APSS_CORE0 -gdb-port $GDB_PORT_APSS_CORE0 -ap-num $AP_NUM_APSS -cti CTI_APSS_CORE0 -event reset-assert-post { dap init }
$_CHIPNAME.apss.core0 configure -event examine-end { 
	eval $_CHIPNAME.apss.core0 arp_halt
}

# ------------- ADSP -----------------
target create $_CHIPNAME.adsp hexagon -dap $_CHIPNAME.dap -dbgbase $DBG_BASE_ADSP -ap-num $AP_NUM_ADSP -gdb-port $GDB_PORT_ADSP -defer-examine

# ----------------------- AWM-M55 ------
target create $_CHIPNAME.awm cortex_m -dap $_CHIPNAME.dap -coreid 0 -dbgbase $DBG_BASE_AWM_CORE0 -gdb-port $GDB_PORT_AWM_CORE0 -ap-num $AP_NUM_AWM -defer-examine
# $_CHIPNAME.awm configure -rtos Zephyr

# ----------------------- SWM-M55 ------
target create $_CHIPNAME.swm cortex_m -dap $_CHIPNAME.dap -coreid 0 -dbgbase $DBG_BASE_SWM_CORE0 -gdb-port $GDB_PORT_SWM_CORE0 -ap-num $AP_NUM_SWM -defer-examine
# $_CHIPNAME.swm configure -rtos Zephyr


