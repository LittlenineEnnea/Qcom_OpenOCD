# @file maili.cfg

# @section Description
# This file is used for defining openocd configuration

# Allow remote (non-localhost) gdb/telnet/tcl connections -- see GDB_REMOTE_HOST
# in settings.json. Only enable on trusted/VPN networks: this exposes
# unauthenticated telnet dap_access memory read/write to the network.
bindto 0.0.0.0

if { [info exists CHIPNAME] } {
   set _CHIPNAME $CHIPNAME
} else {
   set _CHIPNAME MAILI
}

if { [info exists ENDIAN] } {
   set _ENDIAN $ENDIAN
} else {
   set _ENDIAN little
}

if { [info exists DAP_TAPID] } {
	set _DAP_TAPID $DAP_TAPID
} else {
	set _DAP_TAPID 0x4c013477
}

set AP_NUM_AXI 0x24000
set AP_NUM_APB 0x22000
set AP_NUM_APSS 0x30000


set DBG_BASE_APSS_CORE3 0x19330000
set CTI_BASE_APSS_CORE3 0x1d004000
set GDB_PORT_APSS_CORE3 3336

set DBG_BASE_CDSP 0x81191000
set GDB_PORT_CDSP 3002

set DBG_BASE_MPSS 0x81009000
set GDB_PORT_MPSS 3003

set DBG_BASE_SOCCP_HART0 0x913A8000
set GDB_PORT_SOCCP 3100

set AP_NUM_APB_AOSS 0x4000
set DBG_BASE_AOSS_HART0 0x81320000
set GDB_PORT_AOSS 3101

set DBG_BASE_TME_HART0 0x914D0000
set GDB_PORT_TME 3102

set DBG_BASE_DCP_HART0 0x11468000
set GDB_PORT_DCP 3103

set DBG_BASE_CPUCP_HART0 0x92000000
set GDB_PORT_CPUCP 3104

reset_config trst_and_srst

# this will inform openocd to use only hardware breakpoints (THIS IS MANDATORY)
gdb_breakpoint_override hard

# Create DAP/TAP based on Protocol selection
if {$_PROTOCOL == "swd"} {
   swd newdap $_CHIPNAME cpu -expected-id $_DAP_TAPID
} elseif {$_PROTOCOL == "jtag"} {
   set _DAP_TAPID 0x4ba06477
   jtag newtap $_CHIPNAME cpu -irlen 4 -ircapture 1 -expected-id $_DAP_TAPID
}

# --------------- DAP -------------------
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu -ignore-syspwrupack -adiv6

# --------------- CTI -------------------
cti create CTI_APSS_CORE3 -dap $_CHIPNAME.dap -baseaddr $CTI_BASE_APSS_CORE3 -ap-num $AP_NUM_APSS
# cti create CTI_APSS_CORE0 -dap $_CHIPNAME.dap -baseaddr $CTI_BASE_APSS_CORE0 -ap-num $AP_NUM_APSS

# --------------- AXI bus access --------
target create DAP.cxaxi mem_ap -dap $_CHIPNAME.dap -ap-num $AP_NUM_AXI

# --------------- APB bus access --------
target create DAP.cxapb mem_ap -dap $_CHIPNAME.dap -ap-num $AP_NUM_APB
target create DAP.cxapb_aoss mem_ap -dap $_CHIPNAME.dap -ap-num $AP_NUM_APB_AOSS

# ------------- CPUCP -----------------
target create $_CHIPNAME.cpucp riscv -dap $_CHIPNAME.dap -dbgbase $DBG_BASE_CPUCP_HART0 -ap-num $AP_NUM_APB -gdb-port $GDB_PORT_CPUCP -defer-examine
$_CHIPNAME.cpucp configure -event examine-end { 
	eval $_CHIPNAME.cpucp arp_halt
}

# ------------ APSS_CORE3 ---------------
target create $_CHIPNAME.apss.core3 aarch64 -dap $_CHIPNAME.dap -coreid 3 -dbgbase $DBG_BASE_APSS_CORE3 -gdb-port $GDB_PORT_APSS_CORE3 -ap-num $AP_NUM_APSS -cti CTI_APSS_CORE3 -defer-examine
$_CHIPNAME.apss.core3 configure -event examine-end { 
   eval $_CHIPNAME.apss.core3 arp_halt
}

# ------------- CDSP -----------------
# target create $_CHIPNAME.cdsp hexagon -dap $_CHIPNAME.dap -dbgbase $DBG_BASE_CDSP -ap-num $AP_NUM_APB -gdb-port $GDB_PORT_CDSP -defer-examine

# ------------- MPSS -----------------
# target create $_CHIPNAME.mpss hexagon -dap $_CHIPNAME.dap -dbgbase $DBG_BASE_MPSS -ap-num $AP_NUM_APB -gdb-port $GDB_PORT_MPSS -defer-examine

# ------------- SOCCP -----------------
target create $_CHIPNAME.soccp riscv -dap $_CHIPNAME.dap -dbgbase $DBG_BASE_SOCCP_HART0 -ap-num $AP_NUM_APB -gdb-port $GDB_PORT_SOCCP -defer-examine
$_CHIPNAME.soccp configure -event examine-end {
	eval $_CHIPNAME.soccp arp_halt
}

# ------------- AOSS -----------------
target create $_CHIPNAME.aoss riscv -dap $_CHIPNAME.dap -dbgbase $DBG_BASE_AOSS_HART0 -ap-num $AP_NUM_APB_AOSS -gdb-port $GDB_PORT_AOSS -defer-examine
$_CHIPNAME.aoss configure -event examine-end {
	eval $_CHIPNAME.aoss arp_halt
}

# ------------- TME -----------------
target create $_CHIPNAME.tme riscv -dap $_CHIPNAME.dap -dbgbase $DBG_BASE_TME_HART0 -ap-num $AP_NUM_APB -gdb-port $GDB_PORT_TME -defer-examine
$_CHIPNAME.tme configure -event examine-end {
	eval $_CHIPNAME.tme arp_halt
}

