# @file milos.cfg

# @section Description
# This file is used for defining openocd configuration

if { [adapter name] eq "eud" } {
    adapter speed 1875
}

# Allow remote (non-localhost) gdb/telnet/tcl connections -- see GDB_REMOTE_HOST
# in settings.json. Only enable on trusted/VPN networks: this exposes
# unauthenticated telnet dap_access memory read/write to the network.
bindto 0.0.0.0

if { [info exists CHIPNAME] } {
   set _CHIPNAME $CHIPNAME
} else {
   set _CHIPNAME SKYROS
}

if { [info exists ENDIAN] } {
   set _ENDIAN $ENDIAN
} else {
   set _ENDIAN little
}

if { [info exists DAP_TAPID] } {
	set _DAP_TAPID $DAP_TAPID
} else {
	set _DAP_TAPID 0x5ba02477
}

set AP_NUM_APSS 1
set DBG_BASE_APSS_CORE0 0x92010000
set CTI_BASE_APSS_CORE0 0x92020000
set GDB_PORT_APSS_CORE0 3333

set AP_NUM_APB_AOSS 17
set AP_NUM_AHB_AOSS 16
set AP_NUM_AXI_AOSS 0
set DBG_BASE_AOSS_HART0 0x8EC20000
set GDB_PORT_AOSS 3101

set AP_NUM_APB_TME 1
set AP_NUM_AHB_TME 1
set AP_NUM_AXI_TME 0
set DBG_BASE_TME_HART0 0x90CD0000
set GDB_PORT_TME 3102


reset_config trst_and_srst

# this will inform openocd to use only hardware breakpoints (THIS IS MANDATORY)
gdb_breakpoint_override hard

if {$_PROTOCOL == "swd"} {
   swd newdap $_CHIPNAME cpu -irlen 15 -expected-id $_DAP_TAPID
} elseif {$_PROTOCOL == "jtag"} {
   set _DAP_TAPID 0x5ba00477
   jtag newtap $_CHIPNAME cpu -irlen 4 -ircapture 1 -expected-id $_DAP_TAPID
}

dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu -ignore-syspwrupack

# ------------ APSS_CORE0 ---------------
cti create CTI_APSS_CORE0 -dap $_CHIPNAME.dap -baseaddr $CTI_BASE_APSS_CORE0 -ap-num $AP_NUM_APSS
target create $_CHIPNAME.apss.core0 aarch64 -dap $_CHIPNAME.dap -coreid 0 -dbgbase $DBG_BASE_APSS_CORE0 -gdb-port $GDB_PORT_APSS_CORE0 -ap-num $AP_NUM_APSS -cti CTI_APSS_CORE0 -event reset-assert-post { dap init }
$_CHIPNAME.apss.core0 configure -event examine-end { 
	eval $_CHIPNAME.apss.core0 arp_halt
}

# ------------- AOSS -----------------
target create DAP.cxapb_aoss mem_ap -dap $_CHIPNAME.dap -ap-num $AP_NUM_APB_AOSS
target create DAP.cxahb_aoss mem_ap -dap $_CHIPNAME.dap -ap-num $AP_NUM_AHB_AOSS
target create DAP.cxaxi_aoss mem_ap -dap $_CHIPNAME.dap -ap-num $AP_NUM_AXI_AOSS
target create $_CHIPNAME.aoss riscv -dap $_CHIPNAME.dap -dbgbase $DBG_BASE_AOSS_HART0 -ap-num $AP_NUM_APB_AOSS -gdb-port $GDB_PORT_AOSS -defer-examine

# ------------- TME -----------------
target create DAP.cxapb_tme mem_ap -dap $_CHIPNAME.dap -ap-num $AP_NUM_APB_TME
target create DAP.cxahb_tme mem_ap -dap $_CHIPNAME.dap -ap-num $AP_NUM_AHB_TME
target create DAP.cxaxi_tme mem_ap -dap $_CHIPNAME.dap -ap-num $AP_NUM_AXI_TME
target create $_CHIPNAME.tme riscv -dap $_CHIPNAME.dap -dbgbase $DBG_BASE_TME_HART0 -ap-num $AP_NUM_APB_TME -gdb-port $GDB_PORT_TME -defer-examine

