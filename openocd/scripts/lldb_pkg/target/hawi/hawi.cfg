# set AP_NUM_AXI_DCP 0x24000
# set DBG_BASE_DCP_HART0 0x11468000
# set GDB_PORT_DCP 3103

# target create DAP.cxapb_dcp mem_ap -dap $_CHIPNAME.dap -ap-num $AP_NUM_APB_DCP
# target create DAP.cxaxi_dcp mem_ap -dap $_CHIPNAME.dap -ap-num $AP_NUM_AXI_DCP
# target create $_CHIPNAME.dcp riscv -dap $_CHIPNAME.dap -dbgbase $DBG_BASE_DCP_HART0 -ap-num $AP_NUM_APB_DCP -gdb-port $GDB_PORT_DCP -defer-examine
